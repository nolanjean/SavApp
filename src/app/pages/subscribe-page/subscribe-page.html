<div class="subscribe-page d-flex justify-content-center align-items-start pt-4">
  <div class="card subscribe-card shadow-lg">

    <div class="card-header">
      <h4 class="mb-0">
        <i class="bi bi-person-plus-fill me-2"></i>Créer un compte
      </h4>
    </div>

    <div class="card-body p-4">

      @if (errorMessage) {
      <div class="alert alert-danger p-2 small">
        {{ errorMessage }}
      </div>
      }

      @if (successMessage) {
      <div class="alert alert-success p-2 small">
        {{ successMessage }}
      </div>
      }

      <form (ngSubmit)="onSubmit()">
        <!-- Nom d'utilisateur -->
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="JeanDupont" autocomplete="username"
                   [(ngModel)]="form.username" required />
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Adresse email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="exemple&#64;mail.fr"
              autocomplete="email"
              [(ngModel)]="form.email"
              required
            />
          </div>
        </div>

        <!-- Mot de passe -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="new-password"
              [(ngModel)]="form.password"
              required
            />
          </div>
        </div>

        <!-- Confirmation mot de passe -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold">Confirmer le mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="••••••••"
              autocomplete="new-password"
              [(ngModel)]="form.confirmPassword"
              required
            />
          </div>
        </div>

        <!-- CGU -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="cgv" name="cgv"
                 [(ngModel)]="cguAccepted" />
          <label class="form-check-label" for="cgv">
            J'accepte les
            <a routerLink="/legal-notice" class="terms-link">mentions légales</a>
            et les conditions d'utilisation
          </label>
        </div>

        <!-- Bouton créer -->
        <button type="submit" class="btn btn-register w-100" [disabled]="loading">
          @if (loading) {
          <span class="spinner-border spinner-border-sm me-2"></span>Création en cours...
          } @else {
          <i class="bi bi-person-check-fill me-2"></i>Créer mon compte
          }
        </button>
      </form>
    </div>

    <div class="card-footer text-center py-3">
      <small>
        Déjà un compte ?
        <a routerLink="/login" class="login-link fw-semibold">Se connecter</a>
      </small>
    </div>

  </div>
</div>
